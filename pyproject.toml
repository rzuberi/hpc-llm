[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-ollama-cli"
version = "0.1.0"
description = "Submit SLURM GPU jobs to run Ollama and return answers with run logs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13,<14",
  "pydantic>=2,<3",
  "jinja2>=3.1,<4",
]

[project.scripts]
llm = "llm.cli:main"

[tool.setuptools.packages.find]
include = ["llm*"]
